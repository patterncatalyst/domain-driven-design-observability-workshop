# =============================================================================
# Prometheus configuration
# =============================================================================
# Most metrics arrive via the OpenTelemetry Collector, which we scrape.
# Tempo's metrics generator pushes service-graph metrics via remote_write.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: workshop

scrape_configs:
  # Service metrics, exported by the OTel Collector's Prometheus exporter
  - job_name: services-via-otel
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:8889]

  # Collector's own internal metrics (memory, queue depths, dropped spans)
  - job_name: otel-collector-internal
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:8888]

  # Prometheus's own metrics
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
