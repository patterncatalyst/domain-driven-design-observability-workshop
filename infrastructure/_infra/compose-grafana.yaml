# =============================================================================
# Grafana - UI, pre-provisioned with datasources and dashboards
# =============================================================================

services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: workshop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Editor"
      GF_USERS_DEFAULT_THEME: "light"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - workshop

volumes:
  grafana-data:

networks:
  workshop:
    name: workshop
    driver: bridge
