# =============================================================================
# Loki - log storage
# =============================================================================

services:
  loki:
    image: grafana/loki:3.2.1
    container_name: workshop-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro,Z
      - loki-data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - workshop

volumes:
  loki-data:

networks:
  workshop:
    name: workshop
    driver: bridge
