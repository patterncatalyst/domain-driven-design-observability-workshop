# =============================================================================
# Tempo - trace storage
# =============================================================================

services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: workshop-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro,Z
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"     # Tempo HTTP API (Grafana datasource)
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - workshop

volumes:
  tempo-data:

networks:
  workshop:
    name: workshop
    driver: bridge
