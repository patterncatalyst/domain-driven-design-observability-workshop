# =============================================================================
# Tempo configuration
# =============================================================================
# Single-node, file-backed. Metrics generator is enabled so the
# service-graph and span-metrics features work in Grafana out of the box.
# =============================================================================

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h          # short - workshop only

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Metrics generator - emits service graph + span metrics back to Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: workshop
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      enable_messaging_system_latency_histogram: true
    span_metrics:
      dimensions:
        - service.namespace
        - span.kind

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
      generate_native_histograms: both
