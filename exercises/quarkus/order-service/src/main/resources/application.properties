# =============================================================================
# Order service configuration
# =============================================================================

quarkus.application.name=order-service
quarkus.http.port=8080

# OpenTelemetry / OTLP
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=order-service
quarkus.otel.resource.attributes=service.namespace=workshop,deployment.environment=workshop
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=true

# Structured logging
quarkus.log.console.json.enabled=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."service.namespace".value=workshop

# Micrometer
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.kafka.enabled=true

# REST clients
quarkus.rest-client."inventory-rest".url=${INVENTORY_REST_URL:http://localhost:8081}
quarkus.rest-client."payment-rest".url=${PAYMENT_REST_URL:http://localhost:8082}
quarkus.rest-client."shipping-rest".url=${SHIPPING_REST_URL:http://localhost:8083}

# gRPC client
quarkus.grpc.clients."inventory-grpc".host=${INVENTORY_GRPC_HOST:localhost}
quarkus.grpc.clients."inventory-grpc".port=${INVENTORY_GRPC_PORT:9001}
quarkus.grpc.clients."inventory-grpc".plain-text=true

# Inventory adapter selection
workshop.inventory.adapter=rest

# Kafka producer
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-events
mp.messaging.outgoing.order-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.order-events.acks=all
