# =============================================================================
# Order service configuration
# =============================================================================
# Defaults in this file describe the workshop's `main` branch state - a fully
# working, fully observable system. Module-specific overrides (sampling
# changes for Module 6, transport switch for Module 5) are toggled by
# editing values here or via -D system properties on the command line.
# =============================================================================

quarkus.application.name=order-service
quarkus.http.port=8080

# -----------------------------------------------------------------------------
# OpenTelemetry / OTLP
# -----------------------------------------------------------------------------
# Default endpoint targets the OTel Collector running locally (host) or in
# the same compose network ('otel-collector'). The override-able env var
# OTEL_EXPORTER_OTLP_ENDPOINT lets Codespaces and local Docker share the
# same code with different network topologies.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=order-service
quarkus.otel.resource.attributes=service.namespace=workshop,deployment.environment=workshop

# Module 6 starts here at "trace everything" so sampling discussions have a
# concrete baseline. The sampler arg lives at the SDK; tail-sampling is in
# the Collector config.
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=true

# -----------------------------------------------------------------------------
# Structured logging - JSON to stdout, scraped by the OTel Collector / Loki
# -----------------------------------------------------------------------------
# JSON format with explicit additional fields keeps the schema stable across
# services. The 'service.name' field aligns with OTel resource attributes
# so trace-log correlation works without remapping in Loki.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."service.namespace".value=workshop

# -----------------------------------------------------------------------------
# Micrometer / Prometheus
# -----------------------------------------------------------------------------
# Exemplars on - lets metric panels link to representative traces.
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.kafka.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# -----------------------------------------------------------------------------
# REST clients to other services
# -----------------------------------------------------------------------------
# These URLs are overridden by environment variables in compose / Codespaces
# so the same code runs whether services are on host (localhost:N) or on
# the shared 'workshop' network (service-name:N).
quarkus.rest-client."inventory-rest".url=${INVENTORY_REST_URL:http://localhost:8081}
quarkus.rest-client."payment-rest".url=${PAYMENT_REST_URL:http://localhost:8082}
quarkus.rest-client."shipping-rest".url=${SHIPPING_REST_URL:http://localhost:8083}

# -----------------------------------------------------------------------------
# gRPC client for Inventory (Module 5 alternative adapter)
# -----------------------------------------------------------------------------
# The gRPC adapter is wired but not active by default. Switch with:
#   workshop.inventory.adapter=grpc
quarkus.grpc.clients."inventory-grpc".host=${INVENTORY_GRPC_HOST:localhost}
quarkus.grpc.clients."inventory-grpc".port=${INVENTORY_GRPC_PORT:9001}
quarkus.grpc.clients."inventory-grpc".plain-text=true

# -----------------------------------------------------------------------------
# Inventory adapter selection - the ACL transport switch from Module 5
# -----------------------------------------------------------------------------
# Values: 'rest' (default), 'grpc'
# Resolved at build time via @LookupIfProperty in InventoryAdapterSelection.
workshop.inventory.adapter=rest

# -----------------------------------------------------------------------------
# Kafka producer for order events
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-events
mp.messaging.outgoing.order-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.order-events.acks=all
