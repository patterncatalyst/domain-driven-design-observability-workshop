# =============================================================================
# Notification service configuration
# =============================================================================

quarkus.application.name=notification-service
quarkus.http.port=8084

# -----------------------------------------------------------------------------
# OpenTelemetry / OTLP
# -----------------------------------------------------------------------------
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=notification-service
quarkus.otel.resource.attributes=service.namespace=workshop,deployment.environment=workshop
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=true

# -----------------------------------------------------------------------------
# Structured logging
# -----------------------------------------------------------------------------
quarkus.log.console.json.enabled=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."service.namespace".value=workshop

# -----------------------------------------------------------------------------
# Micrometer / Prometheus
# -----------------------------------------------------------------------------
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.kafka.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# -----------------------------------------------------------------------------
# Kafka consumer for order-events
# -----------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order-events
mp.messaging.incoming.order-events.group.id=notification-service-v2
mp.messaging.incoming.order-events.value.deserializer=com.example.notification.infrastructure.kafka.InboundOrderEventDeserializer
mp.messaging.incoming.order-events.auto.offset.reset=earliest

# Throttled commit strategy for high-throughput at-least-once delivery.
# This is the SmallRye default when enable.auto.commit isn't set, but we
# pin it explicitly so Module 6 has a clear knob to point at.
mp.messaging.incoming.order-events.commit-strategy=throttled

# Cooperative sticky assignor avoids the rebalance-rewind issue noted in
# SmallRye Reactive Messaging issue #1403. Recommended for any workload
# using the throttled strategy in production.
mp.messaging.incoming.order-events.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Tunable poll batch size - Module 6 changes this to compare throughput
# vs end-to-end latency.
mp.messaging.incoming.order-events.max.poll.records=500

# Health: report the consumer as not-ready if a record sits unacked for
# more than 30s (default 60s).
mp.messaging.incoming.order-events.throttled.unprocessed-record-max-age.ms=30000
