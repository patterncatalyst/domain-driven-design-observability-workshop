# =============================================================================
# Inventory service configuration
# =============================================================================

quarkus.application.name=inventory-service
quarkus.http.port=8081

# OpenTelemetry / OTLP
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=inventory-service
quarkus.otel.resource.attributes=service.namespace=workshop,deployment.environment=workshop
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.enabled=true

# Structured logging
quarkus.log.console.json.enabled=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
quarkus.log.console.json.additional-field."service.namespace".value=workshop

# Micrometer
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.grpc-server.enabled=true

# gRPC server
quarkus.grpc.server.port=9001
quarkus.grpc.server.host=0.0.0.0
