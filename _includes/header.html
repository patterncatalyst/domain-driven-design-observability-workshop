<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">{{ site.brand_emoji | default: "O" }}</span>
      <span>{{ site.title | default: "Building Observable Domains" }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/docs/00-introduction-setup/' | relative_url }}"
         {% if page.url contains '/docs/' %}aria-current="page"{% endif %}>Tutorial</a>
      <a href="{{ '/docs/prerequisites/' | relative_url }}"
         {% if page.url contains '/prerequisites' %}aria-current="page"{% endif %}>Prerequisites</a>
      <a href="{{ '/docs/architecture/' | relative_url }}"
         {% if page.url contains '/architecture' %}aria-current="page"{% endif %}>Architecture</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}"
         rel="noopener">GitHub</a>
    </nav>
  </div>
</header>
